# Vehicle Detection and Counting System - main configuration
# Every tunable setting lives here so nothing is hardcoded in source files.

model:
  name: yolo26n_visdrone_finetuned
  # Default as of the baseline-vs-finetuned comparison (outputs/results/model_comparison.json):
  # fine-tuning on VisDrone raised overall F1 from 0.275 to 0.652 (mostly recall: 0.16 -> 0.53),
  # fixed the nadir-drone failure case entirely (0 detections -> 24 at avg conf 0.67), and improved
  # the main elevated-camera scenario too (6 detections -> 97 on the same sampled frames), all at
  # effectively the same FPS. To use the original COCO-pretrained baseline instead, switch weights
  # to models/weights/yolo26n.pt and classes to the COCO id scheme (see git history for the exact
  # block - configs/config.yaml before this change).
  weights: models/weights/yolo26n_visdrone_finetuned.pt
  device: auto                # auto | cuda:0 | cpu
  img_size: 640
  confidence: 0.35
  iou: 0.5
  half_precision: true        # use FP16 on GPU to save VRAM and increase speed

classes:
  # Our own 5-class scheme (see training/prepare_visdrone.py) - NOT COCO ids, since this is the
  # fine-tuned model's own class numbering, learned from the remapped VisDrone labels.
  vehicle_class_ids: [0, 1, 2, 3, 4]
  names:
    0: bicycle
    1: car
    2: motorcycle
    3: bus
    4: truck

tracking:
  tracker: bytetrack          # bytetrack | botsort
  persist: true
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30
  match_thresh: 0.8

counting:
  line:
    enabled: true
    # normalized coordinates (0-1) so the line scales with any video resolution
    point1: [0.0, 0.82]
    point2: [1.0, 0.82]
    margin_px: 15   # dead zone around the line to reject box jitter near the boundary
    confirmation_frames: 3   # side-flip must repeat this many consecutive frames before counting -
                              # filters single-frame detection variance (~100ms at 30fps, negligible delay)
  direction_labels: [IN, OUT]

io:
  video_path: data/raw/sample_traffic_elevated.mp4
  output_video_path: outputs/videos/processed.mp4
  output_results_path: outputs/results/counts.json
  save_video: true
  show_display: true

runtime:
  batch_size: 1
  num_workers: 4
  seed: 42

training:
  epochs: 50
  batch_size: 8
  img_size: 640
  patience: 15
  optimizer: auto
  lr0: 0.01
  data_yaml: training/dataset.yaml
